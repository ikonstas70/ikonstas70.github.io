!
! INITIAL CONFIG — BORDER-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname BORDER-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
! SD-WAN vManage/vBond simulation node — management plane
!
interface Loopback0
 description Router-ID
 ip address 10.255.3.1 255.255.255.255
 ipv6 address 2001:db8:ff:3::1/128
 no shutdown
!
interface GigabitEthernet1
 description Management link
 ip address 10.0.201.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet2
 description Control plane — vBond facing
 ip address 203.0.113.101 255.255.255.252
 no shutdown
!
! This node simulates the orchestration plane.
! In a real deployment, vManage/vBond/vSmart are separate VMs.
! Student Tasks:
! 1. Understand vManage NMS, vBond orchestrator, vSmart controller roles
! 2. Configure WAN edge (EDGE-2) to register to this controller
! 3. Push centralized policy via vManage (simulated via IOS config)
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
