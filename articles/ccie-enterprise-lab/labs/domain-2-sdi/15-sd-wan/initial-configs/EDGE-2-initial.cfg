!
! INITIAL CONFIG — EDGE-2
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname EDGE-2
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
! SD-WAN vEdge/cEdge — WAN Edge Router
! WAN transport pre-configured. Overlay NOT configured.
!
interface Loopback0
 description Router-ID
 ip address 10.255.2.2 255.255.255.255
 ipv6 address 2001:db8:ff:2::2/128
 no shutdown
!
interface GigabitEthernet0
 description WAN Transport — MPLS
 ip address 10.0.210.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet1
 description WAN Transport — Internet
 ip address 100.64.1.2 255.255.255.254
 no shutdown
!
interface GigabitEthernet2
 description LAN interface — Segment 10
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
! SD-WAN OMP/TLS Overlay — NOT configured.
! Student Tasks:
! 1. Configure vSmart controllers (OMP): vbond 203.0.113.100
! 2. Configure system parameters: site-id 100, org-name ENTERPRISE-WAN, uuid
! 3. Configure OMP peering, TLOCs, policies
! 4. Configure Application-Aware Routing: performance-map
! 5. Configure centralized data policy for SLA-based routing
! Commands (IOS XE SD-WAN):
!   sdwan
!    vbond 203.0.113.100 port 12346
!   !
!   interface GigabitEthernet0
!    sdwan
!     allow-service all
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
