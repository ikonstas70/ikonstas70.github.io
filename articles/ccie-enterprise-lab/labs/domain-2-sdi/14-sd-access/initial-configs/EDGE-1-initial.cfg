!
! INITIAL CONFIG — EDGE-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname EDGE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
! SD-Access Fabric Border Node — managed by Cisco DNA Center
! Pre-configure underlay only.
!
interface Loopback0
 description Router-ID
 ip address 10.255.2.1 255.255.255.255
 ipv6 address 2001:db8:ff:2::1/128
 no shutdown
!
interface GigabitEthernet1
 description SD-Access Underlay — Link to Fabric Transit
 ip address 10.0.101.1 255.255.255.254
 ipv6 address 2001:db8:0:101::2/64
 no shutdown
!
interface GigabitEthernet2
 description SD-Access Underlay — Link to Fusion Router
 ip address 10.0.201.0 255.255.255.254
 no shutdown
!
! OSPF underlay (IS-IS may be used instead for DNA Center deployments)
router ospf 1
 router-id 10.255.2.1
 passive-interface Loopback0
 network 10.255.2.1 0.0.0.0 area 0
 network 10.0.101.0 0.0.0.1 area 0
!
! SD-Access Overlay — NOT configured.
! Tasks: Configure LISP, VXLAN, VLAN pool, host pool via DNA Center API.
! DNA Center IP: 192.168.200.100 (simulated)
! Fabric site: ENTERPRISE-CAMPUS
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
