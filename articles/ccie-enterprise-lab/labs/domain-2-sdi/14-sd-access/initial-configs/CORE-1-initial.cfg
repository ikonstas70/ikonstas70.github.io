!
! INITIAL CONFIG — CORE-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname CORE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
! SD-Access Fabric Control Plane — LISP Map Server/Resolver
!
interface Loopback0
 description Router-ID
 ip address 10.255.1.1 255.255.255.255
 ipv6 address 2001:db8:ff:1::1/128
 no shutdown
!
interface GigabitEthernet1
 description Fabric Underlay to EDGE-1
 ip address 10.0.101.0 255.255.255.254
 ipv6 address 2001:db8:0:101::1/64
 no shutdown
!
interface GigabitEthernet2
 description Fabric Underlay to EDGE-2
 ip address 10.0.102.0 255.255.255.254
 ipv6 address 2001:db8:0:102::1/64
 no shutdown
!
! OSPF Underlay
router ospf 1
 router-id 10.255.1.1
 passive-interface Loopback0
 network 10.255.1.1 0.0.0.0 area 0
 network 10.0.101.0 0.0.0.1 area 0
 network 10.0.102.0 0.0.0.1 area 0
!
! LISP/VXLAN Overlay — NOT configured here (managed by DNA Center)
! Student Tasks:
! 1. Verify DNA Center discovery of this node
! 2. Configure fabric site and assign VNs
! 3. Create IP pool and host onboarding profiles
! 4. Verify LISP registration: show lisp service ipv4
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
