!
! SOLUTION CONFIG — EDGE-2
! Blueprint: §1.3 EIGRP Named Mode
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname EDGE-2
!
enable algorithm-type scrypt secret Lab@2024#EI
!
key chain KC-EIGRP-AUTH
 key 1
  key-string Tz4!vR8#wL
  cryptographic-algorithm hmac-sha-256
!
interface Loopback0
 description Router-ID and Management Loopback
 ip address 10.255.2.2 255.255.255.255
 ipv6 address 2001:db8:ff:2::2/128
 no shutdown
!
interface GigabitEthernet1
 description Link to CORE-2 (OSPF backbone)
 ip address 10.0.102.1 255.255.255.254
 ip ospf network point-to-point
 ip ospf 1 area 0
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet2
 description Link to HUB-WC-1 (EIGRP)
 ip address 10.0.210.0 255.255.255.254
 ! EIGRP Named Mode authentication applied via address-family
 no shutdown
!
! EIGRP Named Mode — §1.3.e
router eigrp ENTERPRISE
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface GigabitEthernet2
   authentication mode hmac-sha-256
   authentication key-chain KC-EIGRP-AUTH
   ! Stub routing prevents unnecessary queries to DMVPN spokes
   summary-address 10.255.2.0 255.255.255.0
  !
  af-interface Loopback0
   passive-interface
  !
  topology base
   ! Wide metrics for accurate bandwidth calculation (§1.3.b.ii)
   metric weights 0 1 0 1 0 0 0
   ! Fast convergence: reduce query scope (§1.3.f.ii)
   variance 2
  !
  network 10.0.210.0 0.0.0.1
  network 10.255.2.2 0.0.0.0
  eigrp router-id 10.255.2.2
 !
 address-family ipv6 unicast autonomous-system 100
  af-interface GigabitEthernet2
   authentication mode hmac-sha-256
   authentication key-chain KC-EIGRP-AUTH
  !
  eigrp router-id 10.255.2.2
 !
!
end
