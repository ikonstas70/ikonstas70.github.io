!
! INITIAL CONFIG — CE-CORP-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname CE-CORP-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
interface Loopback0
 description Router-ID
 ip address 10.255.7.1 255.255.255.255
 no shutdown
!
! Customer Edge — configure eBGP with EDGE-1 (provider AS 65000). LAN 192.168.10.0/24 advertise into BGP.
!
interface GigabitEthernet1
 description Link to EDGE-1 (PE, AS 65000)
 ip address 10.1.100.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet2
 description LAN Interface
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
