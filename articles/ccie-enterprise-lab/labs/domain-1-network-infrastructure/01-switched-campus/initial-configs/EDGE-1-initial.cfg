!
! INITIAL CONFIG — EDGE-1
! Load this config to start the lab.
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname EDGE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
!
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
interface Loopback0
 description Router-ID and Management Loopback
 ip address 10.255.2.1 255.255.255.255
 ipv6 address 2001:db8:ff:2::1/128
 no shutdown
!
! This router simulates SW-CORE-1 (Multilayer Switch)
! VTP, VLAN, STP, EtherChannel — NOT yet configured
! Gi1 = trunk toward EDGE-2 (SW-CORE-2)
! Gi2 = access port toward CE-CORP-1
interface GigabitEthernet1
 description Trunk to EDGE-2 (SW-CORE-2)
 ip address 10.0.100.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet2
 description Access — CE-CORP-1
 ip address 10.1.100.0 255.255.255.254
 no shutdown
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
