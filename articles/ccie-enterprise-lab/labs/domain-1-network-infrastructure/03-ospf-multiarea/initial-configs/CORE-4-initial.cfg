!
! INITIAL CONFIG — Configure from here
! Host: CORE-4
!
version 17.6
!
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000

hostname CORE-4
!
enable algorithm-type scrypt secret Lab@2024#EI
!
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
line vty 0 15
 transport input ssh
 login authentication default
!
interface Loopback0
 description Router-ID and Management Loopback
 ip address 10.255.1.4 255.255.255.255
 ipv6 address 2001:db8:ff:1::4/128
 no shutdown
!
interface GigabitEthernet1
 description Link to CORE-2
 ip address 10.0.24.1 255.255.255.254
 ipv6 address 2001:db8:0:24::2/64
 no shutdown
!
interface GigabitEthernet2
 description Link to CORE-3
 ip address 10.0.34.1 255.255.255.254
 ipv6 address 2001:db8:0:34::2/64
 no shutdown
!
interface GigabitEthernet3
 description Link to EDGE-4
 ip address 10.0.104.0 255.255.255.254
 ipv6 address 2001:db8:0:104::1/64
 no shutdown
!
end
