!
! INITIAL CONFIG — Configure from here
! Host: CORE-3
!
version 17.6
!
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000

hostname CORE-3
!
enable algorithm-type scrypt secret Lab@2024#EI
!
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
line vty 0 15
 transport input ssh
 login authentication default
!
interface Loopback0
 description Router-ID and Management Loopback
 ip address 10.255.1.3 255.255.255.255
 ipv6 address 2001:db8:ff:1::3/128
 no shutdown
!
interface GigabitEthernet1
 description Link to CORE-1
 ip address 10.0.13.1 255.255.255.254
 ipv6 address 2001:db8:0:13::2/64
 no shutdown
!
interface GigabitEthernet2
 description Link to CORE-4
 ip address 10.0.34.0 255.255.255.254
 ipv6 address 2001:db8:0:34::1/64
 no shutdown
!
interface GigabitEthernet3
 description Link to EDGE-3
 ip address 10.0.103.0 255.255.255.254
 ipv6 address 2001:db8:0:103::1/64
 no shutdown
!
end
