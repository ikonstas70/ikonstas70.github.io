!
! INITIAL CONFIG — Configure from here
! Host: CORE-2
!
version 17.6
!
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000

hostname CORE-2
!
enable algorithm-type scrypt secret Lab@2024#EI
!
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
line vty 0 15
 transport input ssh
 login authentication default
!
interface Loopback0
 description Router-ID and Management Loopback
 ip address 10.255.1.2 255.255.255.255
 ipv6 address 2001:db8:ff:1::2/128
 no shutdown
!
interface GigabitEthernet1
 description Link to CORE-1
 ip address 10.0.12.1 255.255.255.254
 ipv6 address 2001:db8:0:12::2/64
 no shutdown
!
interface GigabitEthernet2
 description Link to CORE-4
 ip address 10.0.24.0 255.255.255.254
 ipv6 address 2001:db8:0:24::1/64
 no shutdown
!
interface GigabitEthernet3
 description Link to EDGE-2
 ip address 10.0.102.0 255.255.255.254
 ipv6 address 2001:db8:0:102::1/64
 no shutdown
!
end
