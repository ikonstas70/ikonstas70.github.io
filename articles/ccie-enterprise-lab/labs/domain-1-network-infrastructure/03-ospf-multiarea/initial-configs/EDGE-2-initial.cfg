!
! INITIAL CONFIG — Configure from here
! Host: EDGE-2
!
version 17.6
!
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000

hostname EDGE-2
!
enable algorithm-type scrypt secret Lab@2024#EI
!
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
line vty 0 15
 transport input ssh
 login authentication default
!
interface Loopback0
 description Router-ID and Management Loopback
 ip address 10.255.2.2 255.255.255.255
 ipv6 address 2001:db8:ff:2::2/128
 no shutdown
!
interface GigabitEthernet1
 description Link to CORE-2
 ip address 10.0.102.1 255.255.255.254
 ipv6 address 2001:db8:0:102::2/64
 no shutdown
!
interface GigabitEthernet2
 description Link to HUB-WC-1
 ip address 10.0.210.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet3
 description Link to HUB-WC-2
 ip address 10.0.211.0 255.255.255.254
 no shutdown
!
end
