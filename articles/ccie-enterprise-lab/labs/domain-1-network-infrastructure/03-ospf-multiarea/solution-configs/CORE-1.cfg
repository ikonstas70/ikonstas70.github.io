!
! SOLUTION CONFIG — CORE-1
! Blueprint: §1.4 OSPF v2 and v3
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname CORE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
!
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
! Key chain for OSPF MD5 authentication
key chain KC-OSPF-AUTH
 key 1
  key-string Nx9#mP2@qK
  cryptographic-algorithm md5
!
interface Loopback0
 description Router-ID and Management Loopback
 ip address 10.255.1.1 255.255.255.255
 ipv6 address 2001:db8:ff:1::1/128
 no shutdown
!
interface GigabitEthernet1
 description Link to CORE-2
 ip address 10.0.12.0 255.255.255.254
 ipv6 address 2001:db8:0:12::1/64
 ! OSPF point-to-point — no DR/BDR election on /31 links
 ip ospf network point-to-point
 ip ospf authentication key-chain KC-OSPF-AUTH
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
 ! BFD for fast failure detection (§1.2.j)
 bfd interval 300 min_rx 300 multiplier 3
 ip ospf bfd
 no shutdown
!
interface GigabitEthernet2
 description Link to CORE-3
 ip address 10.0.13.0 255.255.255.254
 ipv6 address 2001:db8:0:13::1/64
 ip ospf network point-to-point
 ip ospf authentication key-chain KC-OSPF-AUTH
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
 bfd interval 300 min_rx 300 multiplier 3
 ip ospf bfd
 no shutdown
!
interface GigabitEthernet3
 description Link to EDGE-1
 ip address 10.0.101.0 255.255.255.254
 ipv6 address 2001:db8:0:101::1/64
 ip ospf network point-to-point
 ip ospf authentication key-chain KC-OSPF-AUTH
 ip ospf 1 area 0
 ipv6 ospf 1 area 0
 bfd interval 300 min_rx 300 multiplier 3
 ip ospf bfd
 no shutdown
!
! OSPFv2 — §1.4
router ospf 1
 router-id 10.255.1.1
 ! Advertise loopback as /32 host route
 passive-interface Loopback0
 network 10.255.1.1 0.0.0.0 area 0
 ! LSA throttling for fast convergence (§1.4.e.ii)
 timers throttle lsa 0 50 200
 timers throttle spf 50 100 5000
 ! BFD for all OSPF neighbors (§1.2.j)
 bfd all-interfaces
!
! OSPFv3 — §1.4 (IPv6)
ipv6 router ospf 1
 router-id 10.255.1.1
 passive-interface Loopback0
 bfd all-interfaces
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
