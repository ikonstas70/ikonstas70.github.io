!
! INITIAL CONFIG — EDGE-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname EDGE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
mpls ip
mpls ipv6 source-interface Loopback0
mpls ldp router-id Loopback0 force

!
interface Loopback0
 description Router-ID
 ip address 10.255.2.1 255.255.255.255
 ipv6 address 2001:db8:ff:2::1/128
 no shutdown
!
! PIM — NOT configured. Task: enable PIM SM, configure as RP candidate or First-Hop Router.
!
interface GigabitEthernet1
 description Link to CORE-1
 ip address 10.255.2.1 255.255.255.254
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
router ospf 1
 router-id 10.255.2.1
 passive-interface Loopback0
 network 10.255.2.1 0.0.0.0 area 0
 network 10.0.101.0 0.0.0.1 area 0
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
