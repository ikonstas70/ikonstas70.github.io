!
! INITIAL CONFIG — EDGE-2
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname EDGE-2
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
interface Loopback0
 description Router-ID
 ip address 10.255.2.2 255.255.255.255
 no shutdown
!
! Switch Security — NOT configured. Tasks: DHCP snooping, DAI, port security, storm control, IP Source Guard.
!
interface GigabitEthernet1
 description Trunk to EDGE-1 (SW-CORE-1)
 ip address 10.0.100.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet2
 description Uplink to CORE-2
 ip address 10.0.102.1 255.255.255.254
 no shutdown
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
