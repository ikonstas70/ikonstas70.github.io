!
! INITIAL CONFIG — BORDER-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname BORDER-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
interface Loopback0
 description Router-ID
 ip address 10.255.3.1 255.255.255.255
 ipv6 address 2001:db8:ff:3::1/128
 no shutdown
!
! Device Security — NOT configured. Tasks: BGP TTL security, TCP intercept, prefix-list filtering.
!
interface GigabitEthernet1
 description Link to EDGE-1
 ip address 10.0.201.1 255.255.255.254
 ipv6 address 2001:db8:0:201::2/64
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet2
 description Simulated Internet Peer
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 10.255.3.1
 passive-interface Loopback0
 network 10.255.3.1 0.0.0.0 area 0
 network 10.0.201.0 0.0.0.1 area 0
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
