!
! INITIAL CONFIG — HUB-WC-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname HUB-WC-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
interface Loopback0
 description Router-ID
 ip address 10.255.4.1 255.255.255.255
 no shutdown
!
! QoS MQC — NOT configured. Tasks: class-maps, policy-maps, DSCP marking, shaping, policing on DMVPN tunnel.
!
interface GigabitEthernet0
 description Uplink to EDGE-2
 ip address 10.0.210.1 255.255.255.254
 no shutdown
!
! DMVPN tunnel (pre-built — do NOT modify tunnel config, only add QoS service-policy)
interface Tunnel0
 description DMVPN West Primary Hub
 ip address 172.16.10.254 255.255.255.0
 ip nhrp authentication Jm5#bQ9@nW
 ip nhrp map multicast dynamic
 ip nhrp network-id 100
 ip nhrp redirect
 tunnel source GigabitEthernet0
 tunnel mode gre multipoint
 tunnel key 100
 no shutdown
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
