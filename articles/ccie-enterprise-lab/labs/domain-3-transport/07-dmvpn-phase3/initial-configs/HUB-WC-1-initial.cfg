!
! INITIAL CONFIG — HUB-WC-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname HUB-WC-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
interface Loopback0
 description Router-ID
 ip address 10.255.4.1 255.255.255.255
 no shutdown
!
! DMVPN — NOT configured. Task: configure mGRE hub, NHRP server, EIGRP named mode over tunnel.
!
interface GigabitEthernet0
 description Uplink to EDGE-2 (public transport)
 ip address 10.0.210.1 255.255.255.254
 no shutdown
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
