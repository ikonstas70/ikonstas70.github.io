!
! SOLUTION CONFIG — CORE-1 (MPLS P Router)
! Blueprint: §3.1 MPLS, §3.1.b L3VPN
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
mpls ip
mpls ipv6 source-interface Loopback0
logging buffered 64000
!
hostname CORE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
!
key chain KC-OSPF-AUTH
 key 1
  key-string Nx9#mP2@qK
  cryptographic-algorithm md5
!
interface Loopback0
 description Router-ID — LDP uses this as transport address
 ip address 10.255.1.1 255.255.255.255
 ipv6 address 2001:db8:ff:1::1/128
 no shutdown
!
interface GigabitEthernet1
 description Link to CORE-2
 ip address 10.0.12.0 255.255.255.254
 ipv6 address 2001:db8:0:12::1/64
 ip ospf network point-to-point
 ip ospf authentication key-chain KC-OSPF-AUTH
 ip ospf 1 area 0
 ! LDP auto-config from OSPF (§3.1.a.ii)
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 ip ospf bfd
 no shutdown
!
interface GigabitEthernet2
 description Link to CORE-3
 ip address 10.0.13.0 255.255.255.254
 ipv6 address 2001:db8:0:13::1/64
 ip ospf network point-to-point
 ip ospf authentication key-chain KC-OSPF-AUTH
 ip ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 ip ospf bfd
 no shutdown
!
interface GigabitEthernet3
 description Link to EDGE-1
 ip address 10.0.101.0 255.255.255.254
 ip ospf network point-to-point
 ip ospf authentication key-chain KC-OSPF-AUTH
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
router ospf 1
 router-id 10.255.1.1
 passive-interface Loopback0
 network 10.255.1.1 0.0.0.0 area 0
 ! mpls ldp autoconfig enables LDP on all OSPF interfaces (§3.1.a.ii)
 mpls ldp autoconfig
 timers throttle lsa 0 50 200
 timers throttle spf 50 100 5000
 bfd all-interfaces
!
! LDP configuration (§3.1.a.ii)
mpls ldp router-id Loopback0 force
! Custom label range — no trace to defaults
mpls label range 2000 9999
!
end
