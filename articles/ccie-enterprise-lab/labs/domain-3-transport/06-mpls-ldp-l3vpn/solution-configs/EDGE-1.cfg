!
! SOLUTION CONFIG — EDGE-1 (PE Router)
! Blueprint: §3.1.b L3VPN, MP-BGP VPNv4
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
mpls ip
logging buffered 64000
!
hostname EDGE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
!
! VRF CORP definition (§3.1.b)
ip vrf CORP
 rd 65000:100
 route-target export 65000:100
 route-target import 65000:100
!
key chain KC-OSPF-AUTH
 key 1
  key-string Nx9#mP2@qK
  cryptographic-algorithm md5
!
interface Loopback0
 description Router-ID and MP-BGP peering source
 ip address 10.255.2.1 255.255.255.255
 ipv6 address 2001:db8:ff:2::1/128
 no shutdown
!
interface GigabitEthernet1
 description Link to CORE-1 (P router)
 ip address 10.0.101.1 255.255.255.254
 ip ospf network point-to-point
 ip ospf authentication key-chain KC-OSPF-AUTH
 ip ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 ip ospf bfd
 no shutdown
!
interface GigabitEthernet2
 description Link to BORDER-1
 ip address 10.0.201.0 255.255.255.254
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet3
 description PE-CE link — VRF CORP (§3.1.b.i)
 ip vrf forwarding CORP
 ip address 10.1.100.0 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 10.255.2.1
 passive-interface Loopback0
 network 10.255.2.1 0.0.0.0 area 0
 mpls ldp autoconfig
 bfd all-interfaces
!
! PE-CE OSPF for VRF CORP (§3.1.b.i PE-CE routing)
router ospf 10 vrf CORP
 router-id 10.255.2.1
 redistribute bgp 65000 subnets
 network 10.1.100.0 0.0.0.1 area 0
!
! MP-BGP with VPNv4 address family (§3.1.b.ii)
router bgp 65000
 bgp router-id 10.255.2.1
 bgp log-neighbor-changes
 !
 ! iBGP peers — CORE-1 and CORE-2 as Route Reflectors
 neighbor 10.255.1.1 remote-as 65000
 neighbor 10.255.1.1 update-source Loopback0
 neighbor 10.255.1.1 description RR-CORE-1
 neighbor 10.255.1.1 bfd
 !
 address-family vpnv4
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community both
 !
 address-family ipv4 vrf CORP
  redistribute ospf 10
  redistribute connected
 !
!
mpls ldp router-id Loopback0 force
mpls label range 2000 9999
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
