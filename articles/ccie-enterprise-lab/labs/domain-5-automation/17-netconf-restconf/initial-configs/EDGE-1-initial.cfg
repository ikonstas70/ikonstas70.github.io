!
! INITIAL CONFIG — EDGE-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname EDGE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
! NETCONF enabled, RESTCONF enabled
netconf-yang
restconf

!
interface Loopback0
 description Router-ID
 ip address 10.255.2.1 255.255.255.255
 ipv6 address 2001:db8:ff:2::1/128
 no shutdown
!
interface GigabitEthernet1
 description Management link — NETCONF/RESTCONF access
 ip address 10.0.101.1 255.255.255.254
 ipv6 address 2001:db8:0:101::2/64
 no shutdown
!
interface GigabitEthernet2
 description Link to BORDER-1
 ip address 10.0.201.0 255.255.255.254
 no shutdown
!
! NETCONF and RESTCONF are pre-enabled via 'netconf-yang' and 'restconf'.
! Student Tasks:
! 1. Use Python ncclient to GET running config via NETCONF
! 2. Use RESTCONF GET: GET /restconf/data/Cisco-IOS-XE-native:native
! 3. Use RESTCONF PUT: modify interface description via PUT request
! 4. Explore YANG models: show netconf-yang datastores
! 5. Use YANG Suite or Postman for RESTCONF API calls
!
! NETCONF port: 830 | RESTCONF port: 443
! Credentials: admin / Lab@2024#EI
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
