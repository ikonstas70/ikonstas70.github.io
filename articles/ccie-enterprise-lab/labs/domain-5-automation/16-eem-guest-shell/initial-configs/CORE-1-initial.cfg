!
! INITIAL CONFIG — CORE-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname CORE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
interface Loopback0
 description Router-ID
 ip address 10.255.1.1 255.255.255.255
 ipv6 address 2001:db8:ff:1::1/128
 no shutdown
!
! EEM & Guest Shell — NOT configured. Tasks: EEM applets, Tcl scripts, Guest Shell Python.
!
interface GigabitEthernet1
 description Link to CORE-2
 ip address 10.0.12.0 255.255.255.254
 ipv6 address 2001:db8:0:12::1/64
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet2
 description Link to CORE-3
 ip address 10.0.13.0 255.255.255.254
 ipv6 address 2001:db8:0:13::1/64
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet3
 description Link to EDGE-1
 ip address 10.0.101.0 255.255.255.254
 ipv6 address 2001:db8:0:101::1/64
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 10.255.1.1
 passive-interface Loopback0
 network 10.255.1.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.1 area 0
 network 10.0.13.0 0.0.0.1 area 0
 network 10.0.101.0 0.0.0.1 area 0
!
! Guest Shell NOT enabled. Task: 'guestshell enable' and run Python scripts.
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
