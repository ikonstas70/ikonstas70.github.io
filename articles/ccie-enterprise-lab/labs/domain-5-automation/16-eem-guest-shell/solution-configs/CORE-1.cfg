!
! SOLUTION CONFIG — EEM Applets + Guest Shell
! Blueprint: §5.2.a EEM applets, §5.2.b Guest shell
!
version 17.6
service timestamps log datetime msec
no ip domain lookup
ip routing
logging buffered 64000
!
hostname CORE-1-AUTOMATION
!
enable algorithm-type scrypt secret Lab@2024#EI
!
! EEM Applet 1 — Syslog trigger: alert on interface down (§5.2.a)
event manager applet EEM-INTF-DOWN-ALERT
 event syslog pattern "Interface GigabitEthernet.*, changed state to down"
 action 0.1 syslog msg "EEM ALERT: Interface down detected — initiating diagnostics"
 action 0.2 cli command "enable"
 action 0.3 cli command "show interfaces summary | include down"
 action 0.4 cli command "show ip ospf neighbor"
 action 0.5 mail server "10.10.1.50" to "noc@enterprise.local" from "router@enterprise.local" subject "CCIE-LAB Interface Down" body "EEM detected interface state change to down"
!
! EEM Applet 2 — CLI trigger: log config changes (§5.2.a)
event manager applet EEM-CONFIG-CHANGE-LOG
 event cli pattern "configure terminal" sync yes
 action 0.1 syslog priority notifications msg "CONFIG CHANGE INITIATED by $_cli_username from $_cli_remote_host"
!
! EEM Applet 3 — Timer: periodic OSPF neighbor check (§5.2.a)
event manager applet EEM-OSPF-HEALTH-CHECK
 event timer watchdog time 300
 action 0.1 cli command "enable"
 action 0.2 cli command "show ip ospf neighbor | count FULL"
 action 0.3 set ospf_count $_cli_result
 action 0.4 if $_cli_result lt "4"
 action 0.5  syslog priority critical msg "EEM CRITICAL: OSPF neighbor count below threshold — expected 4, got $_cli_result"
 action 0.6 end
!
! EEM Applet 4 — SNMP trigger (§5.2.a)
event manager applet EEM-CPU-HIGH
 event snmp oid 1.3.6.1.4.1.9.9.109.1.1.1.1.8.1 get-type next entry-op gt entry-val "80" poll-interval 60
 action 0.1 syslog priority critical msg "EEM ALERT: CPU utilization exceeds 80% threshold"
 action 0.2 cli command "enable"
 action 0.3 cli command "show processes cpu sorted | head 10"
!
! Guest Shell configuration (§5.2.b)
! iox
! app-hosting appid guestshell
!  app-vnic management guest-interface 0
!  app-resource profile custom
!   cpu 800
!   memory 256
! guestshell enable
!
! SNMP v3 configuration (§4.3.b.ii)
snmp-server group SNMP-MGMT-GRP v3 priv
snmp-server user snmp-admin SNMP-MGMT-GRP v3 auth sha Auth@SNMP#2024 priv aes 128 Priv@SNMP#2024
snmp-server host 10.10.1.100 version 3 priv snmp-admin
snmp-server enable traps
!
end
