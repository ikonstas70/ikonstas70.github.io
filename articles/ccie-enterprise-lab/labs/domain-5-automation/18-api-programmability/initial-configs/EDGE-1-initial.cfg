!
! INITIAL CONFIG — EDGE-1
!
version 17.6
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
no ip domain lookup
ip routing
ipv6 unicast-routing
logging buffered 64000
!
hostname EDGE-1
!
enable algorithm-type scrypt secret Lab@2024#EI
username admin privilege 15 algorithm-type scrypt secret Lab@2024#EI
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
! NETCONF/RESTCONF pre-enabled for API lab
netconf-yang
restconf

!
interface Loopback0
 description Router-ID
 ip address 10.255.2.1 255.255.255.255
 ipv6 address 2001:db8:ff:2::1/128
 no shutdown
!
interface GigabitEthernet1
 description API access link
 ip address 10.0.101.1 255.255.255.254
 ipv6 address 2001:db8:0:101::2/64
 no shutdown
!
interface GigabitEthernet2
 description Link to BORDER-1
 ip address 10.0.201.0 255.255.255.254
 no shutdown
!
! API Programmability Lab — device pre-configured with RESTCONF and NETCONF.
! Student Tasks:
! 1. Python script: read BGP neighbors via RESTCONF
! 2. Python script: configure static route via RESTCONF PATCH
! 3. Python script: subscribe to interface stats via NETCONF notifications
! 4. Ansible playbook: deploy ACL across multiple devices
! 5. Terraform: provision loopback interface (IOS XE provider)
!
! API endpoint: https://10.0.101.1:443/restconf/
! Auth: Basic admin:Lab@2024#EI
!
line vty 0 15
 transport input ssh
 login authentication default
!
end
