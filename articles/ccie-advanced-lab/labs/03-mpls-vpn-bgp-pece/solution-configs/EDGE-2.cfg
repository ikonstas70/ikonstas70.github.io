!
! EDGE-2 — Advanced CCIE RS Lab
! Role: MPLS PE Router, DMVPN WEST gateway
! IPv4 Loopback: 10.255.2.2/32
!
version 15.6
service timestamps debug datetime msec
!
hostname EDGE-2
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
mpls label range 1000 9999
mpls ldp router-id Loopback0 force
mpls ldp neighbor 10.255.1.2 password Fp6&kN3@sX
!
interface Loopback0
 ip address 10.255.2.2 255.255.255.255
 ipv6 address 2001:db8:ff:2::2/128
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/0
 description TO CORE-2 -- 10.0.102.0/31
 ip address 10.0.102.1 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:102::e2/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/1
 description TO HUB-WC-1 -- 10.0.210.0/31
 ip address 10.0.210.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description TO HUB-WC-2 -- 10.0.211.0/31
 ip address 10.0.211.0 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 10.255.2.2
 area 0 authentication message-digest
 passive-interface Loopback0
 passive-interface GigabitEthernet0/1
 passive-interface GigabitEthernet0/2
 network 10.255.2.2 0.0.0.0 area 0
 network 10.0.102.0 0.0.0.1 area 0
 mpls ldp autoconfig area 0
 bfd all-interfaces
!
ipv6 router ospf 1
 router-id 10.255.2.2
 area 0 authentication ipsec spi 256 sha1 1234567890ABCDEF1234567890ABCDEF12345678
 passive-interface Loopback0
!
router bgp 65000
 bgp router-id 10.255.2.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 neighbor 10.255.1.1 remote-as 65000
 neighbor 10.255.1.1 update-source Loopback0
 neighbor 10.255.1.1 password Fp6&kN3@sX
 neighbor 10.255.1.1 bfd
 !
 address-family vpnv4
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community extended
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community
 exit-address-family
!
mpls ipv6 source-interface Loopback0
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
