!
! CORE-3 — INITIAL CONFIG — Advanced CCIE RS Lab
! Student starting point — interfaces pre-configured
!
version 15.6
service timestamps debug datetime msec
!
hostname CORE-3
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
interface Loopback0
 ip address 10.255.1.3 255.255.255.255
 ipv6 address 2001:db8:ff:1::3/128
 no shutdown
!
interface GigabitEthernet0/0
 ip address 10.0.13.1 - TO CORE-1 255.255.255.254
 ipv6 address 2001:db8:0:13::3/64
 no shutdown
!
interface GigabitEthernet0/1
 ip address 10.0.34.0 - TO CORE-4 255.255.255.254
 ipv6 address 2001:db8:0:34::3/64
 no shutdown
!
interface GigabitEthernet0/2
 ip address 10.0.103.0 - TO EDGE-3 255.255.255.254
 ipv6 address 2001:db8:0:103::e3/64
 no shutdown
!
! STUDENT TASK: Add OSPF, MPLS LDP, BFD
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
