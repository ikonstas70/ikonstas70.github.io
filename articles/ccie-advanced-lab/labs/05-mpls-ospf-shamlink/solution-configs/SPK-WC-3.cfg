!
! SPK-WC-3 — Advanced CCIE RS Lab
! Role: DMVPN Phase 3 Spoke, West Region
! Tunnel: 172.16.10.3/24 | Loopback: 10.255.4.13/32
!
version 15.6
service timestamps debug datetime msec
!
hostname SPK-WC-3
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
key chain DMVPN-AUTH
 key 1
  key-string Tz4!vR8#wL
!
interface Loopback0
 ip address 10.255.4.13 255.255.255.255
 ipv6 address 2001:db8:ff:4::33/128
!
interface Loopback1
 description SIMULATED SITE LAN
 ip address 10.10.13.1 255.255.255.0
!
interface GigabitEthernet0/0
 description UPLINK TO PROVIDER (simulated)
 ip address 100.64.3.1 255.255.255.252
 no shutdown
!
interface Tunnel0
 description DMVPN-WEST-SPOKE
 ip address 172.16.10.3 255.255.255.0
 ipv6 address 2001:db8:10::3/64
 ip mtu 1400
 ip nhrp authentication Jm5#bQ9@nW
 ip nhrp map 172.16.10.254 100.64.210.1
 ip nhrp map 172.16.10.253 100.64.211.1
 ip nhrp map multicast 100.64.210.1
 ip nhrp map multicast 100.64.211.1
 ip nhrp network-id 100
 ip nhrp nhs 172.16.10.254 nbma 100.64.210.1 priority 1 cluster 1
 ip nhrp nhs 172.16.10.253 nbma 100.64.211.1 priority 5 cluster 1
 ip nhrp shortcut
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet0/0
 tunnel mode gre multipoint
 tunnel key 100
!
router eigrp DMVPN-FABRIC
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface Tunnel0
   authentication mode md5
   authentication key-chain DMVPN-AUTH
   hello-interval 20
   hold-time 60
   no passive-interface
   summary-address 10.10.13.0 255.255.255.0
  !
  topology base
   stub connected summary
  !
  network 10.255.4.13 0.0.0.0
  network 172.16.10.0 0.0.0.255
  network 10.10.13.0 0.0.0.255
  eigrp router-id 10.255.4.13
 exit-address-family
!
class-map match-all VOICE-TRAFFIC
 match dscp ef
class-map match-all VIDEO-TRAFFIC
 match dscp af41
class-map match-all CRITICAL-DATA
 match dscp af31
!
policy-map DMVPN-QOS-OUT
 class VOICE-TRAFFIC
  priority 512
 class VIDEO-TRAFFIC
  bandwidth 1024
 class CRITICAL-DATA
  bandwidth 512
 class class-default
  fair-queue
!
interface Tunnel0
 service-policy output DMVPN-QOS-OUT
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
