!
! BORDER-1 — Advanced CCIE RS Lab
! Role: ASBR, eBGP AS 65001 to ISP1 (AS 65100) and iBGP to EDGE-1
! IPv4 Loopback: 10.255.3.1/32
!
version 15.6
service timestamps debug datetime msec
!
hostname BORDER-1
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
interface Loopback0
 ip address 10.255.3.1 255.255.255.255
 ipv6 address 2001:db8:ff:3::1/128
!
interface GigabitEthernet0/0
 description TO EDGE-1 -- 10.0.201.0/31
 ip address 10.0.201.1 255.255.255.254
 ipv6 address 2001:db8:0:201::b1/64
 no shutdown
!
interface GigabitEthernet0/1
 description TO ISP1 -- 198.51.100.0/30
 ip address 198.51.100.1 255.255.255.252
 no shutdown
!
router bgp 65001
 bgp router-id 10.255.3.1
 bgp log-neighbor-changes
 !
 neighbor 10.0.201.0 remote-as 65000
 neighbor 10.0.201.0 description EDGE-1-IBGP-PROXY
 neighbor 10.0.201.0 password Fp6&kN3@sX
 neighbor 10.0.201.0 next-hop-self
 !
 neighbor 198.51.100.2 remote-as 65100
 neighbor 198.51.100.2 description ISP1-EBGP
 neighbor 198.51.100.2 password Fp6&kN3@sX
 !
 address-family ipv4
  network 10.255.3.1 mask 255.255.255.255
  neighbor 10.0.201.0 activate
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 route-map FROM-ISP1 in
  neighbor 198.51.100.2 route-map TO-ISP1 out
 exit-address-family
!
route-map FROM-ISP1 permit 10
 set local-preference 200
!
route-map TO-ISP1 permit 10
 match ip address prefix-list CORP-PREFIXES
!
ip prefix-list CORP-PREFIXES permit 10.255.0.0/16 le 32
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
