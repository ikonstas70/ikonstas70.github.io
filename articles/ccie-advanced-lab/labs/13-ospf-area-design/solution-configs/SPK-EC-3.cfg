!
! SPK-EC-3 — Advanced CCIE RS Lab
! Role: DMVPN Phase 3 Spoke, East Region
! Tunnel: 172.16.20.3/24 | Loopback: 10.255.5.13/32
!
version 15.6
service timestamps debug datetime msec
!
hostname SPK-EC-3
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
key chain DMVPN-AUTH
 key 1
  key-string Tz4!vR8#wL
!
interface Loopback0
 ip address 10.255.5.13 255.255.255.255
!
interface Loopback1
 description SIMULATED EAST SITE LAN
 ip address 10.20.13.1 255.255.255.0
!
interface GigabitEthernet0/0
 description UPLINK TO PROVIDER (simulated)
 ip address 100.65.3.1 255.255.255.252
 no shutdown
!
interface Tunnel0
 description DMVPN-EAST-SPOKE
 ip address 172.16.20.3 255.255.255.0
 ip mtu 1400
 ip nhrp authentication Jm5#bQ9@nW
 ip nhrp map 172.16.20.254 100.65.220.1
 ip nhrp map 172.16.20.253 100.65.221.1
 ip nhrp map multicast 100.65.220.1
 ip nhrp map multicast 100.65.221.1
 ip nhrp network-id 200
 ip nhrp nhs 172.16.20.254 nbma 100.65.220.1 priority 1 cluster 1
 ip nhrp nhs 172.16.20.253 nbma 100.65.221.1 priority 5 cluster 1
 ip nhrp shortcut
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet0/0
 tunnel mode gre multipoint
 tunnel key 200
!
router eigrp DMVPN-FABRIC
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface Tunnel0
   authentication mode md5
   authentication key-chain DMVPN-AUTH
   hello-interval 20
   hold-time 60
   no passive-interface
   summary-address 10.20.13.0 255.255.255.0
  !
  topology base
   stub connected summary
  !
  network 10.255.5.13 0.0.0.0
  network 172.16.20.0 0.0.0.255
  network 10.20.13.0 0.0.0.255
  eigrp router-id 10.255.5.13
 exit-address-family
!
class-map match-all VOICE-TRAFFIC
 match dscp ef
class-map match-all CRITICAL-DATA
 match dscp af31
!
policy-map DMVPN-QOS-OUT
 class VOICE-TRAFFIC
  priority 512
 class CRITICAL-DATA
  bandwidth 512
 class class-default
  fair-queue
!
interface Tunnel0
 service-policy output DMVPN-QOS-OUT
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
