!
! HUB-WC-1 — Advanced CCIE RS Lab
! Role: DMVPN Phase 3 Hub, West Region, Primary NHS
! Tunnel: 172.16.10.254/24 | Physical: 10.0.210.1/31 (to EDGE-2)
! IPv4 Loopback: 10.255.4.1/32
!
version 15.6
service timestamps debug datetime msec
!
hostname HUB-WC-1
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
key chain DMVPN-AUTH
 key 1
  key-string Tz4!vR8#wL
!
interface Loopback0
 ip address 10.255.4.1 255.255.255.255
 ipv6 address 2001:db8:ff:4::1/128
!
interface GigabitEthernet0/0
 description TO EDGE-2 -- 10.0.210.0/31
 ip address 10.0.210.1 255.255.255.254
 no shutdown
!
interface Tunnel0
 description DMVPN-WEST-HUB-PRIMARY
 ip address 172.16.10.254 255.255.255.0
 ipv6 address 2001:db8:10::fe/64
 ip mtu 1400
 ip nhrp authentication Jm5#bQ9@nW
 ip nhrp map multicast dynamic
 ip nhrp network-id 100
 ip nhrp redirect
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet0/0
 tunnel mode gre multipoint
 tunnel key 100
!
router eigrp DMVPN-FABRIC
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface default
   passive-interface
  !
  af-interface Tunnel0
   authentication mode md5
   authentication key-chain DMVPN-AUTH
   hello-interval 20
   hold-time 60
   no passive-interface
   no split-horizon
  !
  topology base
   redistribute connected
  !
  network 10.255.4.1 0.0.0.0
  network 172.16.10.0 0.0.0.255
  eigrp router-id 10.255.4.1
 exit-address-family
 !
 address-family ipv6 unicast autonomous-system 100
  !
  af-interface Tunnel0
   authentication mode md5
   authentication key-chain DMVPN-AUTH
   no passive-interface
   no split-horizon
  !
  topology base
  !
  eigrp router-id 10.255.4.1
 exit-address-family
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
