!
! CORE-2 — Advanced CCIE RS Lab
! Role: MPLS P Router (Core), OSPF Area 0, LDP, Route Reflector (MP-BGP)
! IPv4 Loopback: 10.255.1.2/32
! IPv6 Loopback: 2001:db8:ff:1::2/128
!
version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-2
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
!
ipv6 unicast-routing
ipv6 cef
ip cef
!
mpls label range 1000 9999
mpls ldp router-id Loopback0 force
mpls ldp neighbor 10.255.1.1 password Fp6&kN3@sX
mpls ldp neighbor 10.255.1.4 password Fp6&kN3@sX
!
interface Loopback0
 description ROUTER-ID and LDP SOURCE
 ip address 10.255.1.2 255.255.255.255
 ipv6 address 2001:db8:ff:1::2/128
 ipv6 ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/0
 description TO CORE-1 -- 10.0.12.0/31
 ip address 10.0.12.1 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:12::2/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/1
 description TO CORE-4 -- 10.0.24.0/31
 ip address 10.0.24.0 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:24::2/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/2
 description TO EDGE-2 -- 10.0.102.0/31
 ip address 10.0.102.0 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:102::2/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
router ospf 1
 router-id 10.255.1.2
 area 0 authentication message-digest
 passive-interface Loopback0
 network 10.255.1.2 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.1 area 0
 network 10.0.24.0 0.0.0.1 area 0
 network 10.0.102.0 0.0.0.1 area 0
 mpls ldp autoconfig area 0
 bfd all-interfaces
!
ipv6 router ospf 1
 router-id 10.255.1.2
 area 0 authentication ipsec spi 256 sha1 1234567890ABCDEF1234567890ABCDEF12345678
 passive-interface Loopback0
!
router bgp 65000
 bgp router-id 10.255.1.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 neighbor RR-CLIENTS peer-group
 neighbor RR-CLIENTS remote-as 65000
 neighbor RR-CLIENTS update-source Loopback0
 neighbor RR-CLIENTS route-reflector-client
 neighbor RR-CLIENTS password Fp6&kN3@sX
 neighbor RR-CLIENTS bfd
 !
 neighbor 10.255.2.1 peer-group RR-CLIENTS
 neighbor 10.255.2.2 peer-group RR-CLIENTS
 neighbor 10.255.2.3 peer-group RR-CLIENTS
 neighbor 10.255.2.4 peer-group RR-CLIENTS
 neighbor 10.255.3.1 peer-group RR-CLIENTS
 neighbor 10.255.3.2 peer-group RR-CLIENTS
 !
 neighbor 10.255.1.1 remote-as 65000
 neighbor 10.255.1.1 update-source Loopback0
 neighbor 10.255.1.1 password Fp6&kN3@sX
 !
 address-family vpnv4
  neighbor RR-CLIENTS activate
  neighbor RR-CLIENTS send-community extended
  neighbor RR-CLIENTS route-reflector-client
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community extended
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor RR-CLIENTS activate
  neighbor RR-CLIENTS send-community
  neighbor RR-CLIENTS route-reflector-client
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community
 exit-address-family
!
mpls ipv6 source-interface Loopback0
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 exec-timeout 30 0
 transport input ssh
!
end
