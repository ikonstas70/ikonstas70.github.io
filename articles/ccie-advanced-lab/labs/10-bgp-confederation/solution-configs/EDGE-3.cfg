!
! EDGE-3 — Advanced CCIE RS Lab
! Role: MPLS PE Router, DMVPN EAST gateway
! IPv4 Loopback: 10.255.2.3/32
!
version 15.6
service timestamps debug datetime msec
!
hostname EDGE-3
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
mpls label range 1000 9999
mpls ldp router-id Loopback0 force
mpls ldp neighbor 10.255.1.3 password Fp6&kN3@sX
!
interface Loopback0
 ip address 10.255.2.3 255.255.255.255
 ipv6 address 2001:db8:ff:2::3/128
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/0
 description TO CORE-3 -- 10.0.103.0/31
 ip address 10.0.103.1 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:103::e3/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/1
 description TO HUB-EC-1 -- 10.0.220.0/31
 ip address 10.0.220.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/2
 description TO HUB-EC-2 -- 10.0.221.0/31
 ip address 10.0.221.0 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 10.255.2.3
 area 0 authentication message-digest
 passive-interface Loopback0
 passive-interface GigabitEthernet0/1
 passive-interface GigabitEthernet0/2
 network 10.255.2.3 0.0.0.0 area 0
 network 10.0.103.0 0.0.0.1 area 0
 mpls ldp autoconfig area 0
 bfd all-interfaces
!
ipv6 router ospf 1
 router-id 10.255.2.3
 area 0 authentication ipsec spi 256 sha1 1234567890ABCDEF1234567890ABCDEF12345678
 passive-interface Loopback0
!
router bgp 65000
 bgp router-id 10.255.2.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.1.2 remote-as 65000
 neighbor 10.255.1.2 update-source Loopback0
 neighbor 10.255.1.2 password Fp6&kN3@sX
 neighbor 10.255.1.2 bfd
 !
 address-family vpnv4
  neighbor 10.255.1.2 activate
  neighbor 10.255.1.2 send-community extended
 exit-address-family
!
mpls ipv6 source-interface Loopback0
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
