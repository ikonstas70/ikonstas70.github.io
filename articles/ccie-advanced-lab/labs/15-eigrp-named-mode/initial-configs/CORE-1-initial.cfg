!
! CORE-1 — INITIAL CONFIG — Advanced CCIE RS Lab
! =================================================
! STUDENT STARTING POINT — Configure from here
! Interfaces and IPs are pre-configured.
! You must configure: OSPF, LDP, BFD, authentication.
!
version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-1
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
!
ipv6 unicast-routing
ipv6 cef
ip cef
!
interface Loopback0
 description ROUTER-ID
 ip address 10.255.1.1 255.255.255.255
 ipv6 address 2001:db8:ff:1::1/128
 no shutdown
!
interface GigabitEthernet0/0
 description TO CORE-2 -- 10.0.12.0/31
 ip address 10.0.12.0 255.255.255.254
 ipv6 address 2001:db8:0:12::1/64
 no shutdown
!
interface GigabitEthernet0/1
 description TO CORE-3 -- 10.0.13.0/31
 ip address 10.0.13.0 255.255.255.254
 ipv6 address 2001:db8:0:13::1/64
 no shutdown
!
interface GigabitEthernet0/2
 description TO EDGE-1 -- 10.0.101.0/31
 ip address 10.0.101.0 255.255.255.254
 ipv6 address 2001:db8:0:101::1/64
 no shutdown
!
! =============================================
! STUDENT TASK: Configure OSPF, MPLS LDP, BFD
! See lab.html for task sheet
! =============================================
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
