!
! EDGE-1 — Advanced CCIE RS Lab
! Role: MPLS PE Router, VRF CORP, MP-BGP VPNv4 client, eBGP to BORDER-1
! IPv4 Loopback: 10.255.2.1/32
!
version 15.6
service timestamps debug datetime msec
!
hostname EDGE-1
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
ip vrf CORP
 rd 65000:100
 route-target export 65000:100
 route-target import 65000:100
!
ip vrf RETAIL
 rd 65000:200
 route-target export 65000:200
 route-target import 65000:200
!
mpls label range 1000 9999
mpls ldp router-id Loopback0 force
mpls ldp neighbor 10.255.1.1 password Fp6&kN3@sX
!
interface Loopback0
 ip address 10.255.2.1 255.255.255.255
 ipv6 address 2001:db8:ff:2::1/128
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/0
 description TO CORE-1 -- 10.0.101.0/31
 ip address 10.0.101.1 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:101::e1/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/1
 description TO BORDER-1 -- 10.0.201.0/31
 ip address 10.0.201.0 255.255.255.254
 ipv6 address 2001:db8:0:201::e1/64
 no shutdown
!
interface GigabitEthernet0/2
 description TO CE-CORP-1 VRF CORP -- 10.1.100.0/31
 ip vrf forwarding CORP
 ip address 10.1.100.0 255.255.255.254
 no shutdown
!
router ospf 1
 router-id 10.255.2.1
 area 0 authentication message-digest
 passive-interface Loopback0
 passive-interface GigabitEthernet0/1
 passive-interface GigabitEthernet0/2
 network 10.255.2.1 0.0.0.0 area 0
 network 10.0.101.0 0.0.0.1 area 0
 mpls ldp autoconfig area 0
 bfd all-interfaces
!
ipv6 router ospf 1
 router-id 10.255.2.1
 area 0 authentication ipsec spi 256 sha1 1234567890ABCDEF1234567890ABCDEF12345678
 passive-interface Loopback0
!
router ospf 10 vrf CORP
 router-id 10.255.2.1
 network 10.1.100.0 0.0.0.1 area 100
 redistribute bgp 65000 subnets route-map OSPF-TO-CE
!
router bgp 65000
 bgp router-id 10.255.2.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 neighbor 10.255.1.1 remote-as 65000
 neighbor 10.255.1.1 update-source Loopback0
 neighbor 10.255.1.1 password Fp6&kN3@sX
 neighbor 10.255.1.1 bfd
 !
 neighbor 10.0.201.1 remote-as 65001
 neighbor 10.0.201.1 description BORDER-1-EBGP
 neighbor 10.0.201.1 password Fp6&kN3@sX
 !
 address-family vpnv4
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CORP
  redistribute connected
  redistribute ospf 10 match internal external
  neighbor 10.1.100.1 remote-as 65500
  neighbor 10.1.100.1 activate
  neighbor 10.1.100.1 as-override
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community
 exit-address-family
!
mpls ipv6 source-interface Loopback0
!
route-map OSPF-TO-CE permit 10
 match ip address prefix-list VPN-PREFIXES
!
ip prefix-list VPN-PREFIXES permit 0.0.0.0/0 le 32
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
