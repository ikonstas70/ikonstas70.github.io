  <text x="400" y="155" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">Active Nodes: BORDER-1,BORDER-2,EDGE-1,EDGE-4</text>

  <!-- Color coded zone boxes -->
  <rect x="80" y="175" width="620" height="200" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="400" y="200" text-anchor="middle" fill="#d29922" font-size="11" font-weight="bold">Communities</text>

  <!-- Router nodes listed -->
  <text x="400" y="240" text-anchor="middle" fill="#e6edf3" font-size="12">BORDER-1,BORDER-2,EDGE-1,EDGE-4</text>

  <!-- Protocol info -->
  <text x="400" y="290" text-anchor="middle" fill="#8b949e" font-size="10">Refer to lab.html for complete step-by-step configuration</text>
  <text x="400" y="310" text-anchor="middle" fill="#8b949e" font-size="10">and verification commands for each active router</text>

  <!-- Legend strip -->
  <rect x="40" y="455" width="720" height="28" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
