<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" style="background:#0d1117;font-family:'Courier New',monospace;">
  <rect x="0" y="0" width="800" height="500" fill="#0d1117"/>
  <text x="400" y="28" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">11 BGP COMMUNITIES</text>
  <text x="400" y="46" text-anchor="middle" fill="#d29922" font-size="11">Communities — Active: BORDER-1,BORDER-2,EDGE-1,EDGE-4</text>

  <!-- Reference topology note -->
  <rect x="40" y="70" width="720" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
