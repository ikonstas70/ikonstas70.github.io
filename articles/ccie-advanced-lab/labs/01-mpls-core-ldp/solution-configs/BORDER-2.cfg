!
! BORDER-2 — Advanced CCIE RS Lab
! Role: ASBR, eBGP AS 65001 to ISP2 (AS 65200) and iBGP to EDGE-4
! IPv4 Loopback: 10.255.3.2/32
!
version 15.6
service timestamps debug datetime msec
!
hostname BORDER-2
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
interface Loopback0
 ip address 10.255.3.2 255.255.255.255
 ipv6 address 2001:db8:ff:3::2/128
!
interface GigabitEthernet0/0
 description TO EDGE-4 -- 10.0.204.0/31
 ip address 10.0.204.1 255.255.255.254
 ipv6 address 2001:db8:0:204::b2/64
 no shutdown
!
interface GigabitEthernet0/1
 description TO ISP2 -- 203.0.113.0/30
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
router bgp 65001
 bgp router-id 10.255.3.2
 bgp log-neighbor-changes
 !
 neighbor 10.0.204.0 remote-as 65000
 neighbor 10.0.204.0 description EDGE-4-IBGP-PROXY
 neighbor 10.0.204.0 password Fp6&kN3@sX
 neighbor 10.0.204.0 next-hop-self
 !
 neighbor 203.0.113.2 remote-as 65200
 neighbor 203.0.113.2 description ISP2-EBGP
 neighbor 203.0.113.2 password Fp6&kN3@sX
 !
 address-family ipv4
  network 10.255.3.2 mask 255.255.255.255
  neighbor 10.0.204.0 activate
  neighbor 203.0.113.2 activate
  neighbor 203.0.113.2 route-map FROM-ISP2 in
  neighbor 203.0.113.2 route-map TO-ISP2 out
 exit-address-family
!
route-map FROM-ISP2 permit 10
 set local-preference 100
!
route-map TO-ISP2 permit 10
 match ip address prefix-list CORP-PREFIXES
!
ip prefix-list CORP-PREFIXES permit 10.255.0.0/16 le 32
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
