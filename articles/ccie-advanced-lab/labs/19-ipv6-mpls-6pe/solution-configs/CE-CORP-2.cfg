!
! CE-CORP-2 — Advanced CCIE RS Lab
! Role: Customer Edge router, VRF CORP site 2, BGP AS 65500
! IPv4 Loopback: 10.255.6.2/32
!
version 15.6
service timestamps debug datetime msec
!
hostname CE-CORP-2
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
interface Loopback0
 ip address 10.255.6.2 255.255.255.255
 ipv6 address 2001:db8:ff:6::2/128
!
interface Loopback1
 description SIMULATED LAN CORP SITE 2
 ip address 192.168.200.1 255.255.255.0
 ipv6 address 2001:db8:100:2::1/64
!
interface GigabitEthernet0/0
 description TO EDGE-4 (PE) -- 10.1.200.0/31
 ip address 10.1.200.1 255.255.255.254
 ipv6 address 2001:db8:0:c200::c2/64
 no shutdown
!
router bgp 65500
 bgp router-id 10.255.6.2
 bgp log-neighbor-changes
 neighbor 10.1.200.0 remote-as 65000
 neighbor 10.1.200.0 description PE-EDGE-4
 neighbor 10.1.200.0 password Fp6&kN3@sX
 neighbor 10.1.200.0 allowas-in 1
 !
 address-family ipv4
  network 10.255.6.2 mask 255.255.255.255
  network 192.168.200.0 mask 255.255.255.0
  neighbor 10.1.200.0 activate
 exit-address-family
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
