!
! CORE-4 — Advanced CCIE RS Lab
! Role: MPLS P Router (Core), OSPF Area 0, LDP
! IPv4 Loopback: 10.255.1.4/32
!
version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname CORE-4
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
mpls label range 1000 9999
mpls ldp router-id Loopback0 force
mpls ldp neighbor 10.255.1.2 password Fp6&kN3@sX
mpls ldp neighbor 10.255.1.3 password Fp6&kN3@sX
!
interface Loopback0
 ip address 10.255.1.4 255.255.255.255
 ipv6 address 2001:db8:ff:1::4/128
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/0
 description TO CORE-2 -- 10.0.24.0/31
 ip address 10.0.24.1 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:24::4/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/1
 description TO CORE-3 -- 10.0.34.0/31
 ip address 10.0.34.1 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:34::4/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/2
 description TO EDGE-4 -- 10.0.104.0/31
 ip address 10.0.104.0 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:104::4/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
router ospf 1
 router-id 10.255.1.4
 area 0 authentication message-digest
 passive-interface Loopback0
 network 10.255.1.4 0.0.0.0 area 0
 network 10.0.24.0 0.0.0.1 area 0
 network 10.0.34.0 0.0.0.1 area 0
 network 10.0.104.0 0.0.0.1 area 0
 mpls ldp autoconfig area 0
 bfd all-interfaces
!
ipv6 router ospf 1
 router-id 10.255.1.4
 area 0 authentication ipsec spi 256 sha1 1234567890ABCDEF1234567890ABCDEF12345678
 passive-interface Loopback0
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
