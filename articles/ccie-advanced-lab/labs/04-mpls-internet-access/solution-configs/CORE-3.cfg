!
! CORE-3 — Advanced CCIE RS Lab
! Role: MPLS P Router (Core), OSPF Area 0, LDP
! IPv4 Loopback: 10.255.1.3/32
!
version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname CORE-3
!
enable algorithm-type scrypt secret Lab@2024#IK
!
no ip domain-lookup
ip domain-name lab.enterprise.net
ipv6 unicast-routing
ip cef
ipv6 cef
!
mpls label range 1000 9999
mpls ldp router-id Loopback0 force
mpls ldp neighbor 10.255.1.1 password Fp6&kN3@sX
mpls ldp neighbor 10.255.1.4 password Fp6&kN3@sX
!
interface Loopback0
 ip address 10.255.1.3 255.255.255.255
 ipv6 address 2001:db8:ff:1::3/128
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/0
 description TO CORE-1 -- 10.0.13.0/31
 ip address 10.0.13.1 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:13::3/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/1
 description TO CORE-4 -- 10.0.34.0/31
 ip address 10.0.34.0 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:34::3/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet0/2
 description TO EDGE-3 -- 10.0.103.0/31
 ip address 10.0.103.0 255.255.255.254
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 Nx9#mP2@qK
 ip ospf network point-to-point
 ip ospf bfd
 ipv6 address 2001:db8:0:103::3/64
 ipv6 ospf 1 area 0
 mpls ip
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
router ospf 1
 router-id 10.255.1.3
 area 0 authentication message-digest
 passive-interface Loopback0
 network 10.255.1.3 0.0.0.0 area 0
 network 10.0.13.0 0.0.0.1 area 0
 network 10.0.34.0 0.0.0.1 area 0
 network 10.0.103.0 0.0.0.1 area 0
 mpls ldp autoconfig area 0
 bfd all-interfaces
!
ipv6 router ospf 1
 router-id 10.255.1.3
 area 0 authentication ipsec spi 256 sha1 1234567890ABCDEF1234567890ABCDEF12345678
 passive-interface Loopback0
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 logging synchronous
 transport input ssh
!
end
